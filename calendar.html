<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pick your time · Star Founder</title>
<meta name="description" content="Book your Star Founder onboarding call: twenty minutes with the team before week one.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101014;
    --bone:#F7F4ED;
    --gold:#E9B44C;
    --ink-06:rgba(16,16,20,.06);
    --ink-12:rgba(16,16,20,.12);
    --ink-55:rgba(16,16,20,.55);
    --bone-08:rgba(247,244,237,.08);
    --bone-14:rgba(247,244,237,.16);
    --bone-60:rgba(247,244,237,.62);
    --bone-80:rgba(247,244,237,.86);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
  body{font-family:'Inter',sans-serif;background:var(--bone);color:var(--ink);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased}
  h1{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em;line-height:1.08}
  a{color:inherit}
  .container{max-width:960px;margin:0 auto;padding:0 28px}
  .icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}

  header{position:sticky;top:0;z-index:50;background:rgba(16,16,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bone-08)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand svg{width:34px;height:34px;flex:none}
  .brand .bname{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:.06em;color:var(--bone)}
  .homelink{color:var(--bone-60);text-decoration:none;font-size:14.5px;font-weight:600}
  .homelink:hover{color:var(--bone)}

  .wrap{padding:72px 0 100px}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:13px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:26px;color:var(--gold)}
  .eyebrow svg{width:14px;height:14px;flex:none}
  h1{font-size:clamp(40px,5.6vw,64px);font-weight:700;letter-spacing:-.03em;margin-bottom:18px}
  .lede{font-size:18px;line-height:1.6;color:var(--ink-55);max-width:36em;margin-bottom:40px}

  .btn{
    display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--ink);
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;
    padding:14px 26px;border:none;border-radius:999px;cursor:pointer;text-decoration:none;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(233,180,76,.35)}
  .btn .icon{transition:transform .15s ease}
  .btn:hover .icon{transform:translateX(3px)}
  .btn.small{padding:10px 18px;font-size:14.5px}

  /* dummy booking calendar — swap the whole .cal widget for the GHL embed */
  .cal{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--ink-12);border-radius:12px;background:#fff;max-width:860px;overflow:hidden}
  .cal-month{padding:30px 32px;border-right:1px solid var(--ink-12)}
  .cal-title{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:18px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-head span{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-55);text-align:center;padding:6px 0}
  .cal-day{aspect-ratio:1;border:none;background:transparent;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink)}
  .cal-day:hover:not(:disabled){background:var(--ink-06)}
  .cal-day:disabled{color:rgba(16,16,20,.25);cursor:default}
  .cal-day.blank{visibility:hidden}
  .cal-day.sel{background:var(--gold);color:var(--ink);font-weight:600}
  .cal-hint{font-size:13px;color:var(--ink-55);margin-top:16px}
  .cal-side{padding:30px 32px;display:flex;flex-direction:column}
  .cal-slots-title{font-size:15px;color:var(--ink-55);margin-bottom:16px}
  .cal-slots-title b{color:var(--ink);font-weight:600}
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
  .slot{border:1px solid var(--ink-12);background:transparent;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;padding:10px 4px;color:var(--ink);transition:border-color .12s ease}
  .slot:hover{border-color:var(--ink-55)}
  .slot.sel{background:var(--ink);color:var(--bone);border-color:var(--ink);font-weight:600}
  #cal-confirm{margin-top:auto;align-self:flex-start}

  footer{background:var(--ink);color:var(--bone-60);border-top:1px solid var(--bone-08);padding:40px 0 56px;font-size:14.5px}
  .footfine{font-size:12.5px;color:rgba(247,244,237,.38)}

  @media (max-width:960px){
    .wrap{padding:56px 0 80px}
    .cal{grid-template-columns:1fr}
    .cal-month{border-right:none;border-bottom:1px solid var(--ink-12)}
  }
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.5c.7 5.9-2.2 8.8-8.1 9.5 5.9.7 8.8 3.6 8.1 9.5-.7-5.9 2.2-8.8 8.1-9.5-5.9-.7-8.8-3.6-8.1-9.5Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
</svg>

<header>
  <div class="container nav">
    <a class="brand" href="index.html" aria-label="Star Founder home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.7 5.9-2.2 8.8-8.1 9.5 5.9.7 8.8 3.6 8.1 9.5-.7-5.9 2.2-8.8 8.1-9.5-5.9-.7-8.8-3.6-8.1-9.5Z" fill="#E9B44C"/><path d="M12 1.5c.7 5.9-2.2 8.8-8.1 9.5 5.9.7 8.8 3.6 8.1 9.5-.7-5.9 2.2-8.8 8.1-9.5-5.9-.7-8.8-3.6-8.1-9.5Z" fill="#E9B44C" opacity="0.45" transform="rotate(45 12 12)"/></svg>
      <span class="bname">STAR FOUNDER</span>
    </a>
    <a class="homelink" href="index.html">Back to the page</a>
  </div>
</header>

<section class="wrap">
  <div class="container">
    <div class="eyebrow"><svg><use href="#i-star"/></svg>Onboarding call</div>
    <h1>Pick your time.</h1>
    <p class="lede">Twenty minutes with the team before week one. We go over your delegation list, you ask anything, week one starts clean.</p>

    <!-- TODO(GHL): swap this dummy widget for the real GHL calendar embed (builder → Calendars → embed),
         or replace this whole page with the calendar's hosted URL -->
    <div class="cal" id="cal">
      <div class="cal-month">
        <div class="cal-title" id="cal-title">Loading…</div>
        <div class="cal-grid cal-head">
          <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
        </div>
        <div class="cal-grid" id="cal-days"></div>
        <p class="cal-hint">Pick a day, then a time.</p>
      </div>
      <div class="cal-side">
        <div class="cal-slots-title">Times for <b id="cal-daylabel">—</b></div>
        <div class="slot-grid" id="cal-slots"></div>
        <button class="btn small" id="cal-confirm" type="button" disabled style="opacity:.45;cursor:not-allowed">Confirm Your Call <svg class="icon"><use href="#i-arrow-right"/></svg></button>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <p class="footfine">Star Founder · a cohort by Kasim Aslam</p>
  </div>
</footer>

<script>
  // Dummy booking calendar: pick a day, pick a time, confirm.
  // Placeholder for the GHL calendar embed — swap the whole .cal widget when it exists.
  (function(){
    const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
    const slots=["9:00 AM","10:30 AM","12:00 PM","2:00 PM","3:30 PM","5:00 PM"];
    const today=new Date();
    const title=document.getElementById('cal-title');
    const daysEl=document.getElementById('cal-days');
    const slotsEl=document.getElementById('cal-slots');
    const dayLabel=document.getElementById('cal-daylabel');
    const confirmBtn=document.getElementById('cal-confirm');
    title.textContent=monthNames[today.getMonth()]+" "+today.getFullYear();

    const bookable=new Set();
    for(let i=0;i<14;i++){const d=new Date(today);d.setDate(d.getDate()+i);bookable.add(d.getDate());}

    const first=new Date(today.getFullYear(),today.getMonth(),1);
    const lead=(first.getDay()+6)%7; // Monday-first grid
    const daysInMonth=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
    for(let i=0;i<lead;i++){const b=document.createElement('button');b.className='cal-day blank';b.disabled=true;b.tabIndex=-1;daysEl.appendChild(b);}
    for(let d=1;d<=daysInMonth;d++){
      const b=document.createElement('button');
      b.className='cal-day';b.type='button';b.textContent=d;
      if(!bookable.has(d))b.disabled=true;
      b.addEventListener('click',()=>{
        daysEl.querySelectorAll('.cal-day.sel').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        const dt=new Date(today.getFullYear(),today.getMonth(),d);
        dayLabel.textContent=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
        renderSlots();
      });
      daysEl.appendChild(b);
    }
    function renderSlots(){
      slotsEl.innerHTML='';
      slots.forEach(s=>{
        const b=document.createElement('button');
        b.className='slot';b.type='button';b.textContent=s;
        b.addEventListener('click',()=>{
          slotsEl.querySelectorAll('.slot.sel').forEach(x=>x.classList.remove('sel'));
          b.classList.add('sel');
          confirmBtn.disabled=false;
          confirmBtn.style.opacity='1';
          confirmBtn.style.cursor='pointer';
        });
        slotsEl.appendChild(b);
      });
    }
    confirmBtn.addEventListener('click',()=>{
      document.getElementById('cal').innerHTML=
        '<div style="grid-column:1/-1;padding:60px 40px;text-align:center">'+
        '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.01em;color:#101014;margin-bottom:8px">You\'re booked.</div>'+
        '<p style="font-size:15px;color:rgba(16,16,20,.55);margin:0">'+dayLabel.textContent+' at '+slotsEl.querySelector('.slot.sel').textContent+'. A calendar invite is on its way to your inbox.</p>'+
        '</div>';
    });
  })();
</script>

</body>
</html>
